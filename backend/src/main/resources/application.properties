spring.application.name=cinestream-backend

# H2 in-memory DB (fine for a portfolio demo; swap for Postgres in production)
spring.datasource.url=jdbc:h2:mem:moviedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# TMDB — no default here on purpose. Set TMDB_API_KEY as an environment
# variable, or run with the "local" profile (see application-local.properties,
# which is gitignored and never committed).
tmdb.api.key=${TMDB_API_KEY:}
tmdb.base.url=https://api.themoviedb.org/3
tmdb.image.base.url=https://image.tmdb.org/t/p

# URL of the Python ML microservice.
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}

server.port=${PORT:8080}
